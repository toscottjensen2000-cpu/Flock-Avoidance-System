plugins {
    id 'com.android.application'
}

android {
    namespace 'net.flockroute.app'
    compileSdk 35

    defaultConfig {
        applicationId 'net.flockroute.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so "Build APK" gives an installable file with no keystore setup.
            // Make your own key (Build > Generate Signed App Bundle / APK) before sharing it widely.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copy the web app (repo's web/ folder) into the APK's assets before every build, so the page and
// config.js (your CARTO key) only need to live in web/.
def webSource = file("$projectDir/../../web")
tasks.register('syncWebAssets', Sync) {
    from(webSource) {
        include 'index.html', 'config.js', 'icons/**'
    }
    into file("$projectDir/src/main/assets/www")
}
preBuild.dependsOn 'syncWebAssets'

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
